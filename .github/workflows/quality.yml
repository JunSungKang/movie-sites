name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
      JAVA_TOOL_OPTIONS: -XX:-UsePerfData -Djava.io.tmpdir=${{ github.workspace }}/.cache/tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare project-local temporary directory
        run: mkdir -p .cache/tmp
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify repository and application
        shell: bash
        run: |
          python3 -B - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [p for p in files if (p.startswith('movie/') and p != 'movie/.gitkeep') or p.startswith(('runtime/', '.cache/', '.codex-work/', 'build/', '.gradle/'))]
          assert not forbidden, f'Private runtime files are tracked: {forbidden}'
          PY
          ./gradlew --no-daemon clean build
          bash ./scripts/check.sh
          python3 -B scripts/check-docs.py
