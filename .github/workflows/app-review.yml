name: Current head App approval
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ['Review event']
    types: [completed]
concurrency:
  group: app-review-${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || format('review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  verify-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish formal App approval check on the exact PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B - <<'PY'
          import os, json, urllib.request, base64, datetime, re
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          repo = os.environ['GITHUB_REPOSITORY']
          if 'pull_request' in event:
              number = int(event['pull_request']['number'])
          else:
              run = event['workflow_run']
              assert run['head_repository']['full_name'] == repo, 'Unexpected review notification repository'
              match = re.fullmatch(r'review-([0-9]+)', run['display_title'])
              assert match, 'Invalid review notification'
              number = int(match.group(1))
          def api(path, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              return json.load(urllib.request.urlopen(req, timeout=30))
          pr = api('/pulls/' + str(number))
          head = pr['head']['sha']
          check = api('/check-runs', 'POST', {'name':'app-review', 'head_sha':head, 'status':'in_progress', 'details_url':os.environ['GITHUB_SERVER_URL'] + '/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID']})
          error = None
          try:
              policy_file = api('/contents/.github/codex-governance.json?ref=' + pr['base']['sha'])
              policy = json.loads(base64.b64decode(policy_file['content']))
              assert pr['state'] == 'open', 'PR must be open'
              assert pr['user']['login'] == policy['prAuthorLogin'], 'Unexpected PR author'
              assert any(x['login'] == policy['assigneeLogin'] for x in pr['assignees']), 'Human assignee is required'
              reviews = []
              for page in range(1, 101):
                  batch = api('/pulls/' + str(number) + '/reviews?per_page=100&page=' + str(page))
                  reviews.extend(batch)
                  if len(batch) < 100: break
              else: raise AssertionError('Review history exceeds the verification limit')
              current = [r for r in reviews if r['user']['login'] == policy['reviewerLogin'] and r['commit_id'] == head and r.get('submitted_at')]
              current.sort(key=lambda r: (r['submitted_at'], r['id']))
              assert current and current[-1]['state'] == 'APPROVED', 'Current head requires formal App APPROVED review'
              assert api('/pulls/' + str(number))['head']['sha'] == head, 'PR head changed during verification'
          except Exception as exc:
              error = str(exc)
          api('/check-runs/' + str(check['id']), 'PATCH', {'status':'completed', 'conclusion':'failure' if error else 'success', 'completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'output':{'title':'App approval required' if error else 'Current head App approval verified', 'summary':error or ('Verified formal App approval for ' + head)}})
          if error: raise SystemExit(error)
          print('Verified App approval for', head)
          PY
