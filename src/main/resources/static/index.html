<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff9ed"><meta name="description" content="좋아하는 친구들과 함께 보는 우리집 영상 놀이터, MovieSites">
  <title>MovieSites — 영상 라이브러리</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="/css/app.css?v=4dd07433d0549b67">
  <script type="module" src="/js/app.js?v=1079ba42f3ea5ef6"></script>
</head>
<body>
<a class="skip-link" href="#content">목록으로 바로 가기</a>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 1 6M20 3v5h-5"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="m11 5-7 7 7 7M4 12h16"/></symbol>
<symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="m17 5 4 14"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</defs></svg>
<div class="playground-decoration" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="site-header">
  <a class="brand" href="/" aria-label="MovieSites 처음으로"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><rect x="3" y="8" width="34" height="27" rx="10" fill="#ffce63"/><path d="m15 3 5 5 5-5" fill="none" stroke="#4a86c6" stroke-width="3" stroke-linecap="round"/><path d="m17 16 10 6-10 6Z" fill="#fff"/></svg></span><span>MovieSites</span></a>
  <span class="header-label">우리집 영상 놀이터</span>
</header>
<main id="content" class="main-content">
  <div class="wayfinding"><button id="parent-button" class="parent-button" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg><span>상위 폴더</span></button><nav id="breadcrumbs" class="breadcrumbs" aria-label="현재 위치"></nav></div>
  <div class="page-heading"><div><p class="eyebrow">친구들과 함께하는 이야기 시간</p><h1 id="folder-title">오늘은 누구랑 놀까요?</h1><p class="page-description" id="folder-description">좋아하는 친구를 골라 이야기를 만나보세요.</p></div><img class="heading-friends" src="/images/play-friends.svg" alt="" width="280" height="190"></div>
  <div class="listing-toolbar"><p id="listing-status" class="listing-status" role="status" aria-live="polite"></p><button id="refresh-button" class="refresh-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>새로고침</span></button></div>
  <section id="notice" class="notice" role="alert" hidden></section>
  <section id="folder-section" class="folder-section" aria-labelledby="folders-heading" hidden><h2 id="folders-heading" class="section-caption">친구들을 만나봐요</h2><div id="folder-list" class="folder-list"></div></section>
  <section id="video-section" class="video-section" aria-labelledby="videos-heading" hidden><h2 id="videos-heading" class="section-caption">보고 싶은 이야기를 골라요</h2><div id="video-list" class="video-list" aria-busy="true"></div></section>
  <section id="empty-state" class="empty-state" hidden><span class="empty-mark" aria-hidden="true">☆</span><h2>아직 이야기가 없어요.</h2><p>영상을 넣으면 여기에 나타나요.<br>추가한 영상은 새로고침으로 만나보세요.</p></section>
  <div id="loading-state" class="loading-state" role="status"><span class="loading-dot"></span>폴더를 불러오는 중입니다.</div>
  <nav id="pagination" class="pagination" aria-label="목록 이동" hidden><button id="first-button" class="text-button" type="button" hidden>처음 목록</button><button id="previous-button" class="text-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg>이전</button><span id="page-label"></span><button id="next-button" class="text-button" type="button">다음<svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button></nav>
  <footer class="page-footer"><span>함께 웃는 우리집 영상 시간</span><a id="source-link" href="https://github.com/JunSungKang/movie-sites" target="_blank" rel="noopener noreferrer">오픈소스 · AGPL-3.0</a></footer>
</main>
<dialog id="player-dialog" class="player-dialog" aria-labelledby="player-title">
  <header class="player-heading"><div><p id="player-folder" class="eyebrow"></p><h2 id="player-title"></h2></div><button id="close-player" class="icon-button" type="button" aria-label="재생 화면 닫기"><svg class="icon"><use href="#i-close"/></svg></button></header>
  <div class="player-surface"><video id="video-player" controls playsinline preload="metadata" hidden></video><div id="player-preparing" class="player-preparing"><svg class="icon"><use href="#i-film"/></svg><p id="player-state" role="status" aria-live="polite">영상을 확인하고 있습니다.</p><progress id="player-progress" aria-label="영상 준비 중"></progress></div></div>
  <div class="player-bottom"><p id="player-file"></p><button id="retry-player" class="text-button" type="button" hidden>다시 확인</button></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
